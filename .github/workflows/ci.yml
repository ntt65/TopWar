name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Unity 프로젝트와 라이선스 시크릿이 모두 있을 때만 테스트를 돌린다.
      - name: Check project and license
        id: ready
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
        run: |
          if [ ! -f ProjectSettings/ProjectVersion.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity project not found - skipping tests."
          elif [ "$HAS_LICENSE" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE secret is not set - skipping tests."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.ready.outputs.run == 'true'
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run EditMode and PlayMode tests
        if: steps.ready.outputs.run == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all
